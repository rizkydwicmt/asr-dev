name: build-amd64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rizkydwicmt/asr-dev:dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone CrispASR
        run: |
          git clone --depth 1 --recursive https://github.com/CrispStrobe/CrispASR crispasr
          rm -rf crispasr/build crispasr/.git

      - name: Build image (linux/amd64, native runner, slim — models via initContainer)
        run: |
          docker build -t "$IMAGE" .
          docker save "$IMAGE" | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Login ghcr.io (GITHUB_TOKEN bawaan)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push ke ghcr.io
        run: docker push "$IMAGE"

      - name: Upload image artifact (backup, opsional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-dev-image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0
