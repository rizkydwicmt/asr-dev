name: build-amd64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone CrispASR
        run: |
          git clone --depth 1 --recursive https://github.com/CrispStrobe/CrispASR crispasr
          rm -rf crispasr/build crispasr/.git

      - name: Build image (linux/amd64, native runner, slim — models via initContainer)
        run: |
          docker build -t asr-dev:dev .
          docker save asr-dev:dev | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: asr-dev-image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0
